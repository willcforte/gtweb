name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on invalid frontmatter, duplicate redirect sources, and any
      # internal link or redirect destination that does not resolve.
      - run: npm run verify

      - run: npx astro check
